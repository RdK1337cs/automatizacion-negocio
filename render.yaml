# Blueprint de Render: crea el servicio web con un clic desde el dashboard
# (New + -> Blueprint -> seleccionar el repo automatizacion-negocio)
#
# Nota: en el plan gratuito el filesystem es efímero: la base SQLite y las fotos
# se pierden al redeployar. Para datos durables, subí a Starter ($7/mes) y
# agregá un disco persistente (DATA_DIR=/data, mountPath /data).
services:
  - type: web
    name: automatizacion-negocio
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm install --prefix web --include=dev && npm run build && npm run web:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true